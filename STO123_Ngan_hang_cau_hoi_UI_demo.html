rder-radius:8px;font-size:12px;font-weight:700;padding:10px 14px;display:inline-flex;justify-content:center;align-items:center;gap:7px;white-space:nowrap}.btn:hover{background:#f0f5fc}.btn.primary{background:#215ab1;border-color:#215ab1;color:#fff}.btn.primary:hover{background:#154b9d}.btn.danger{color:#b34443;border-color:#e8cbcb}.btn.small{padding:8px 11px;font-size:11px}.tabs{display:flex;gap:5px;border-bottom:1px solid #dce5f0;margin-bottom:18px}.tab{background:transparent;border:none;border-bottom:3px solid transparent;padding:13px 15px;color:#71819a;font-weight:650;font-size:12px}.tab.active{color:#205cb5;border-bottom-color:#205cb5}.filters{display:grid;grid-template-columns:minmax(0,1fr) 160px 155px;gap:10px;margin-bottom:15px}.control{border:1px solid #d6e1ee;border-radius:8px;padding:10px 12px;min-width:0;width:100%;background:#fff;color:#253c59;font-size:12px;outline:none}.control:focus{border-color:#6a94cf;box-shadow:0 0 0 3px #e3edff}.statline{display:flex;justify-content:space-between;color:#75859a;font-size:11px;margin-bottom:12px;gap:10px}.surface{background:#fff;border:1px solid #e0e8f2;border-radius:12px;overflow:hidden}.listhead{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(185px,.85fr) 110px;gap:18px;background:#f8fafd;color:#79889d;padding:13px 18px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.35px}.record{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(185px,.85fr) 110px;gap:18px;align-items:center;padding:15px 18px;border-top:1px solid #edf1f7}.record:hover{background:#fbfdff}.record .name{font-size:13px;font-weight:800;color:#1a365a;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tag{border-radius:5px;background:#edf3fd;color:#38639d;padding:4px 7px;font-size:10px;font-weight:750}.desc{font-size:12px;line-height:1.55;margin-top:5px;color:#465b75}.meta{font-size:10px;color:#8795a9;margin-top:6px}.use-title{font-size:11px;font-weight:750;color:#2b5ca5}.use-meta{font-size:10px;color:#7b8ea5;line-height:1.5;margin-top:3px}.none{font-size:11px;color:#94a1b1}.empty{text-align:center;padding:50px 12px;color:#8391a4;font-size:13px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:17px;align-items:start}.detail-layout.editing{grid-template-columns:minmax(0,1fr) 300px}.card{background:#fff;border:1px solid #e0e8f2;border-radius:12px;padding:20px;margin-bottom:15px;min-width:0}.card h3{font-size:15px;margin:0 0 6px;color:#1c3759}.card .hint{font-size:11px;color:#7e8da2;line-height:1.6;margin:4px 0 15px}.doc{font-size:12px;color:#364a64;line-height:1.65}.doc table{border-collapse:collapse;width:100%;font-size:11px;margin-top:11px}.doc th,.doc td{padding:10px;border:1px solid #dce6f0;text-align:left}.doc th{background:#f2f6fa;color:#244368}.qblock{border:1px solid #e0e8f2;border-radius:10px;padding:17px;margin-top:11px}.qblock .qtop{font-size:12px;font-weight:800;margin-bottom:10px;color:#22528c}.qtext{font-size:13px;color:#233b58;font-weight:600;margin:0 0 9px;line-height:1.55}.opt{font-size:12px;padding:9px 11px;border-radius:7px;margin:3px 0;color:#39516e;line-height:1.5}.opt.correct{background:#eaf7ef;color:#17714d;border:1px solid #a8dcc1;font-weight:750}.reason{font-size:11px;color:#61728a;padding-top:12px;border-top:1px solid #ebeff5;margin-top:12px;line-height:1.65}.sidecard{position:sticky;top:16px}.exam{padding:12px;border:1px solid #dce7f6;background:#f6f9fe;border-radius:9px;margin:10px 0}.exam strong{font-size:12px;color:#2b5caa}.exam small{display:block;margin-top:4px;color:#6d829d;font-size:10px}.badge{font-size:10px;font-weight:700;color:#287451;background:#e8f7ee;border-radius:5px;padding:4px 7px;display:inline-block;margin-top:9px}.badge.history{color:#736979;background:#f2f0f5}.sidecard p{font-size:11px;color:#708098;line-height:1.65}.warning{background:#fff8ea;border:1px solid #f0dfb8;padding:11px 12px;border-radius:8px;font-size:11px;color:#8a682e;line-height:1.65}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fg{display:flex;flex-direction:column;gap:6px;min-width:0}.fg label{font-size:11px;font-weight:750;color:#334c68}.fg textarea{min-height:83px;resize:vertical}.sectionlabel{display:flex;align-items:center;gap:8px;margin-bottom:15px;font-size:14px;font-weight:800;color:#214064}.step{background:#e8f0fc;color:#245da7;padding:5px 8px;border-radius:6px;font-size:10px}.edit-question{border:1px solid #dce7f3;border-radius:10px;padding:16px;margin:11px 0}.edit-question>strong{font-size:12px;display:block;margin-bottom:12px}.formfoot{display:flex;gap:9px;justify-content:flex-end;padding:14px 0 22px}.media-tile{background:#f7faff;border:1px dashed #bacde3;border-radius:8px;padding:13px}.media-tile input{max-width:100%;margin-top:10px;font-size:11px}.notice{font-size:11px;color:#7b8da3;line-height:1.55}.row-flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.correctpick{border:1px solid #cde1d8;background:#f2fbf6;color:#286347;border-radius:8px;padding:8px 10px}.modalbg{position:fixed;inset:0;background:#091e36a8;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;border-radius:14px;padding:24px;max-width:470px;width:100%;box-shadow:0 14px 55px #071d3230}.modal h2{margin:0 0 9px;font-size:19px}.modal p{font-size:12px;color:#5c6e86;line-height:1.6}.toast{position:fixed;right:22px;bottom:22px;background:#1d426c;color:#fff;padding:12px 17px;border-radius:9px;font-size:12px;z-index:9;box-shadow:0 10px 30px #0d2c4940;max-width:350px}@media(max-width:1000px){.detail-layout,.detail-layout.editing{grid-template-columns:1fr}.sidecard{position:static}.stage{padding:24px}.record,.listhead{grid-template-columns:minmax(0,1fr) minmax(160px,.7fr) 105px}}@media(max-width:720px){.shell{grid-template-columns:1fr}.side{padding:10px 14px;flex-direction:row;gap:12px;align-items:center}.side-note{display:none}.nav{margin-left:auto}.topbar{padding:13px 17px}.stage{padding:20px 14px}.header{flex-direction:column}.header h1{font-size:22px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.listhead{display:none}.record{grid-template-columns:1fr 1fr;gap:12px}.record>div:first-child{grid-column:1/-1}.record>div:last-child{text-align:right}.formgrid{grid-template-columns:1fr}}@media(max-width:410px){.record{grid-template-columns:1fr}.record>div:last-child{text-align:left}.top-user span{display:none}}

<body>
<div id="app"><div class="shell"><aside class="side"><div class="brand"><div class="mark">STO</div><div><b>STO123</b><small>Quản trị nội dung</small></div></div><div class="nav">▤ &nbsp; Ngân hàng câu hỏi</div><div class="side-note">Bản thiết kế UI/UX<br>Không kết nối Azure SQL</div></aside><div class="main"><header class="topbar"><div><b>Ngân hàng câu hỏi</b><br><small>STO123 / Quản trị</small></div><div class="top-user"><div class="avatar">TA</div><span>Admin nội dung</span></div></header><main id="page" class="stage"></main></div></div></div>
<script>
(function(){
const initial=[
{id:'g59',bank:'exam',part:7,kind:'group',name:'Nhóm 59',description:'Harbis Stationery Store — Clearance Sale',media:'Tài liệu bảng',shared:'',translation:'',document:{type:'TABLE',title:'Harbis Stationery Store',body:'Clearance Sale. Prices are for in-store purchases only.',headers:['Category','Item','Price / Discount'],rows:[['Seasonal Items','Box of ten seasonal cards','25% off'],['Seasonal Items','Box of five invitations','50% off'],['School Supplies','Box of 24 pens','10% off'],['School Supplies','Wireless mouse','10% off']]},questions:[{id:147,text:'What is indicated about Harbis Stationery Store?',options:['It provides materials for students.','It has stores in multiple locations.','It is celebrating an anniversary.','It provides free shipping for online orders.'],correct:0,difficulty:'Dễ',explain:'Cửa hàng cung cấp đồ dùng học tập và văn phòng phẩm.'},{id:148,text:'What item is discounted by the greatest percentage?',options:['Box of ten cards','Box of five invitations','Wireless mouse','Desk lamp'],correct:1,difficulty:'Dễ',explain:'Box of five invitations giảm 50%, mức giảm cao nhất.'}],usage:[{exam:'ETS 2023 — Test 01',version:'V1',code:'#1',state:'current'}]},
{id:'g32',bank:'exam',part:3,kind:'group',name:'Nhóm 32',description:'Hội thoại Part 3 — 3 câu',media:'Có âm thanh',shared:'Audio hội thoại Part 3',translation:'',questions:[32,33,34].map((id,i)=>({id,text:['What is the conversation mainly about?','What does the woman suggest?','What will the man probably do next?'][i],options:['A sample option A','A sample option B','A sample option C','A sample option D'],correct:i%4,difficulty:'Trung bình',explain:'Giải thích minh họa từ dữ liệu câu.'})),usage:[{exam:'ETS 2023 — Test 01',version:'V1',code:'#1',state:'current'}]},
{id:'s385',bank:'exam',part:5,kind:'single',name:'Câu 385',description:'Incomplete Sentences — câu độc lập',media:'Không cần media',shared:'',translation:'',questions:[{id:385,text:'The company _____ its annual report yesterday.',options:['publish','published','publishing','publishes'],correct:1,difficulty:'Trung bình',explain:'Yesterday yêu cầu thì quá khứ đơn.'}],usage:[]},
{id:'s1',bank:'exam',part:1,kind:'single',name:'Câu 1',description:'Photographs — nghe và quan sát ảnh',media:'Ảnh + âm thanh',shared:'',translation:'',questions:[{id:1,text:'Choose the statement that best describes the photograph.',options:['A woman is standing near a desk.','A woman is climbing some stairs.','A woman is entering a building.','A woman is looking at a map.'],correct:3,difficulty:'Dễ',explain:'Phương án D mô tả hành động trong hình.'}],usage:[{exam:'ETS 2023 — Test 01',version:'V1',code:'#1',state:'current'}]},
{id:'p650',bank:'practice',part:5,kind:'single',name:'Câu 650',description:'Practice — từ vựng trong công việc',media:'Không cần media',shared:'',translation:'',questions:[{id:650,text:'Please submit the report _____ Friday.',options:['on','by','at','during'],correct:1,difficulty:'Dễ',explain:'By Friday biểu thị hạn chót.'}],usage:[]},
{id:'p710',bank:'practice',part:3,kind:'group',name:'Nhóm 110',description:'Hội thoại luyện nghe Part 3',media:'Có âm thanh',shared:'Audio bài luyện',translation:'',questions:[710,711,712].map((id,i)=>({id,text:`Practice conversation question ${i+1}`,options:['Option A','Option B','Option C','Option D'],correct:0,difficulty:'Trung bình',explain:'Giải thích bài luyện.'})),usage:[]}
];
let data=JSON.parse(JSON.stringify(initial)),bank='exam',view='list',selected='g59',editing=false,draft=null,filter='',shape='all',part='all',modal=false,toastTimer;
const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=()=>data.find(x=>x.id===selected);
const button=(label,action,klass='')=>`<button class="btn ${klass}" data-action="${action}">${label}</button>`;
const crumbs=(tail='')=>`<div class="crumb"><button data-action="list">Ngân hàng câu hỏi</button>${tail?`<span>›</span><span>${escape(tail)}</span>`:''}</div>`;
function usageList(usage){if(!usage?.length)return '<span class="none">Chưa thuộc đề hiện hành</span>';const active=usage.filter(x=>x.state==='current'),past=usage.filter(x=>x.state!=='current');return `<div class="use-title">${active.length?escape(active[0].exam):'Không còn trong đề hiện hành'}</div><div class="use-meta">${active.length?escape(active[0].code+' · '+active[0].version+' · Đang sử dụng'):''}${active.length>1?` · +${active.length-1} đề`:''}${past.length?` · ${past.length} phiên bản lịch sử`:''}</div>`;}
function list(){const x=data.filter(r=>r.bank===bank&&(shape==='all'||r.kind===shape)&&(part==='all'||String(r.part)===part)&&(!filter||[r.name,r.description,r.questions.map(q=>q.id+' '+q.text).join(' '),r.usage.map(u=>u.exam).join(' ')].join(' ').toLowerCase().includes(filter.toLowerCase())));return `${crumbs()}<div class="header"><div><h1>Ngân hàng câu hỏi</h1><p class="subtitle">Xem đầy đủ nội dung, sửa hoặc xóa ngay trong chi tiết. Thêm câu hỏi ở trang riêng.</p></div>${button('＋ Thêm câu hỏi','add','primary')}</div><div class="tabs"><button class="tab ${bank==='exam'?'active':''}" data-bank="exam">Câu hỏi đề thi</button><button class="tab ${bank==='practice'?'active':''}" data-bank="practice">Câu hỏi luyện tập</button></div><div class="filters"><input class="control" id="search" placeholder="Tìm mã câu, mã nhóm, nội dung hoặc tên đề thi..." value="${escape(filter)}"><select class="control" id="shape"><option value="all">Tất cả câu hỏi</option><option value="group" ${shape==='group'?'selected':''}>Nhóm câu</option><option value="single" ${shape==='single'?'selected':''}>Câu riêng</option></select><select class="control" id="part"><option value="all">Tất cả Part</option>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${part===String(n)?'selected':''}>Part ${n}</option>`).join('')}</select></div><div class="statline"><span><strong>${x.length}</strong> đơn vị nội dung</span><span>Nhóm hiển thị một mục · Không trùng câu thành viên</span></div><div class="surface"><div class="listhead"><div>Câu hỏi / Nhóm câu</div><div>Đang thuộc đề thi</div><div>Thao tác</div></div>${x.length?x.map(r=>`<div class="record"><div><div class="name">${escape(r.name)} <span class="tag">Part ${r.part}</span><span class="tag">${r.questions.length} câu</span></div><div class="desc">${escape(r.description)}</div><div class="meta">Mã câu: ${r.questions.map(q=>q.id).join(', ')} &nbsp;·&nbsp; ${escape(r.media)}</div>${filter&&r.questions.some(q=>String(q.id)===filter.trim())?`<span class="tag" style="margin-top:7px">Khớp câu ${escape(filter.trim())}</span>`:''}</div><div>${r.bank==='exam'?usageList(r.usage):'<span class="none">Ngân hàng luyện tập</span>'}</div><div>${button('Xem chi tiết','detail:'+r.id,'small')}</div></div>`).join(''):'<div class="empty">Không tìm thấy câu hỏi phù hợp với bộ lọc.</div>'}</div>`;}
function commonPreview(r){if(r.part===7&&r.document){const d=r.document;return `<div class="card"><h3>Tài liệu đọc · ${escape(d.type)}</h3><p class="hint">Hiển thị theo cấu trúc tài liệu thực tế, không tạo vùng ngữ liệu trống.</p><div class="doc"><strong>${escape(d.title||'Tài liệu')}</strong><p>${escape(d.body||'')}</p>${d.type==='TABLE'?`<table><thead><tr>${(d.headers||[]).map(h=>`<th>${escape(h)}</th>`).join('')}</tr></thead><tbody>${(d.rows||[]).map(row=>`<tr>${row.map(v=>`<td>${escape(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}</div></div>`;}if(r.part===3||r.part===4||r.part===6||r.part<=2){return `<div class="card"><h3>${r.part===3?'Hội thoại chung':r.part===4?'Bài nói chung':r.part===6?'Đoạn văn':'Media câu hỏi'}</h3><p class="hint">${r.part===1?'Ảnh và âm thanh được liên kết ở cấp nguồn.':r.part===2?'Âm thanh câu hỏi.': 'Ngữ liệu được dùng chung cho các câu trong nhóm.'}</p><div class="media-tile">${r.part===1?'▣ Ảnh TOEIC · ':'♫ Audio'} <strong>${escape(r.media)}</strong>${r.shared?`<p>${escape(r.shared)}</p>`:''}<div class="notice">Media thật sẽ được phát từ API STO123; bản này không sử dụng URL sản xuất.</div></div></div>`;}return ''}
function questionPreview(r){return `<div class="card"><div class="row-flex"><h3>${r.kind==='group'?'Các câu hỏi trong nhóm':'Nội dung câu hỏi'}</h3><span class="tag">${r.questions.length} câu</span></div>${r.questions.map((q,i)=>`<div class="qblock"><div class="qtop">Câu ${i+1} · #${q.id}</div><p class="qtext">${escape(q.text)}</p>${q.options.map((s,j)=>`<div class="opt ${j===q.correct?'correct':''}"><b>${'ABCD'[j]}.</b> ${escape(s)} ${j===q.correct?' ✓ Đáp án đúng':''}</div>`).join('')}<div class="reason"><strong>Độ khó:</strong> ${escape(q.difficulty)}<br><strong>Giải thích:</strong> ${escape(q.explain)}</div></div>`).join('')}</div>`}
function sideUsage(r){return `<aside><section class="card sidecard"><h3>Đang thuộc đề thi nào?</h3><p>Hiển thị cụ thể tên đề và phiên bản hiện hành, không chỉ ghi “1 liên kết đề”.</p>${r.bank==='practice'?'<p>Ngân hàng luyện tập — không tham chiếu đề thi.</p>':r.usage.length?r.usage.map(u=>`<div class="exam"><strong>${escape(u.exam)}</strong><small>${escape(u.code)} · Phiên bản ${escape(u.version)}</small><span class="badge ${u.state==='current'?'':'history'}">${u.state==='current'?'Đang sử dụng hiện hành':'Chỉ trong lịch sử'}</span></div>`).join(''):'<p>Chưa có đề thi hiện hành sử dụng nội dung này.</p>'}<div class="warning">Sửa trực tiếp dữ liệu nguồn phải được backend xác minh và bảo vệ các phiên bản bài thi. Đây chỉ là minh họa, không ghi Azure SQL.</div></section></aside>`}
function details(){const r=item();if(!r){view='list';return list()}return `${crumbs(r.name)}<div class="header"><div><h1>${escape(r.name)} <span class="tag">Part ${r.part}</span></h1><p class="subtitle">${r.questions.length} câu · Mã câu ${r.questions.map(q=>q.id).join(', ')} · ${r.bank==='exam'?'Câu hỏi đề thi':'Câu hỏi luyện tập'}</p></div><div class="actions">${button('← Danh sách','list')}${button('✎ Sửa trực tiếp','edit','primary')}${button('Xóa vĩnh viễn','delete','danger')}</div></div><div class="detail-layout"><div>${commonPreview(r)}${questionPreview(r)}</div>${sideUsage(r)}</div>`;}
function formField(label,name,value='',opts={}){return `<div class="fg"><label>${escape(label)}</label>${opts.textarea?`<textarea class="control" name="${name}">${escape(value)}</textarea>`:`<input class="control" name="${name}" value="${escape(value)}" ${opts.type?`type="${opts.type}"`:''}>`}</div>`}
function form(r,isNew){const partNum=r.part;let common='';if(partNum===7){const d=r.document||{type:'TEXT',title:'',body:'',headers:['Category','Item','Price'],rows:[]};common=`<div class="card"><div class="sectionlabel"><span class="step">02</span> Tài liệu Part 7</div><div class="formgrid"><div class="fg"><label>Loại tài liệu</label><select class="control" name="doctype" id="doctype">${['TEXT','EMAIL','TABLE','CHAT','FORM','IMAGE'].map(v=>`<option ${d.type===v?'selected':''}>${v}</option>`).join('')}</select></div>${formField('Tiêu đề tài liệu','doctitle',d.title)}</div><div style="margin-top:13px">${formField('Nội dung / mô tả tài liệu','docbody',d.body,{textarea:true})}</div><div id="doc-special" style="margin-top:13px"></div><p class="notice">Phần editor minh họa các trường theo từng loại tài liệu. Khi triển khai phải dùng đúng ExamDocumentCodec.</p></div>`}else if(partNum!==5){common=`<div class="card"><div class="sectionlabel"><span class="step">02</span> ${partNum===1?'Hình ảnh và audio':partNum===2?'Audio câu hỏi':partNum===3?'Hội thoại chung':partNum===4?'Bài nói chung':'Đoạn văn chung'}</div>${partNum>=3?formField('Ngữ liệu chung','shared',r.shared,{textarea:true}):''}${partNum!==6?`<div class="formgrid" style="margin-top:14px"><div class="media-tile"><strong>Audio MP3</strong><input type="file" name="audio" accept="audio/*"><div class="notice">Bản demo không upload thật</div></div>${partNum===1?`<div class="media-tile"><strong>Hình ảnh</strong><input type="file" name="image" accept="image/*"><div class="notice">Bản demo không upload thật</div></div>`:''}</div>`:''}</div>`}
return `${crumbs(isNew?'Thêm câu hỏi':r.name+' / Chỉnh sửa')}<div class="header"><div><h1>${isNew?'Thêm câu hỏi':`Chi tiết ${escape(r.name)} · đang sửa`}</h1><p class="subtitle">${isNew?'Trang thêm riêng, không có drawer hoặc nhân bản.':'Chỉnh sửa ngay trên màn hình chi tiết, không chuyển sang một giao diện sửa riêng.'}</p></div><div class="actions">${button('Hủy','cancel')}${button('Lưu '+(isNew?'câu hỏi':'thay đổi'),'save','primary')}</div></div><div class="detail-layout editing"><form id="editor" onsubmit="return false;"><div class="card"><div class="sectionlabel"><span class="step">01</span> Thông tin chung</div><div class="formgrid"><div class="fg"><label>Ngân hàng</label><select class="control" name="bank" ${!isNew?'disabled':''}><option value="exam" ${r.bank==='exam'?'selected':''}>Câu hỏi đề thi</option><option value="practice" ${r.bank==='practice'?'selected':''}>Câu hỏi luyện tập</option></select></div><div class="fg"><label>TOEIC Part</label><select class="control" id="editpart" name="part" ${!isNew?'disabled':''}>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${r.part===n?'selected':''}>Part ${n}</option>`).join('')}</select></div></div></div>${common}<div class="card"><div class="sectionlabel"><span class="step">03</span> Câu hỏi và đáp án</div>${r.questions.map((q,i)=>`<div class="edit-question"><strong>Câu ${i+1} ${!isNew?'· #'+q.id:''}</strong>${formField('Nội dung câu hỏi','text-'+i,q.text,{textarea:true})}<div class="formgrid" style="margin-top:13px">${q.options.map((opt,j)=>formField('Đáp án '+ 'ABCD'[j],'opt-'+i+'-'+j,opt)).join('')}</div><div class="formgrid" style="margin-top:13px"><div class="fg"><label>Đáp án đúng</label><select class="control correctpick" name="correct-${i}">${q.options.map((_,j)=>`<option value="${j}" ${q.correct===j?'selected':''}>${'ABCD'[j]} — ${escape(q.options[j]).slice(0,65)}</option>`).join('')}</select></div><div class="fg"><label>Độ khó</label><select class="control" name="difficulty-${i}">${['Dễ','Trung bình','Khó'].map(z=>`<option ${q.difficulty===z?'selected':''}>${z}</option>`).join('')}</select></div></div><div style="margin-top:13px">${formField('Giải thích','explain-'+i,q.explain,{textarea:true})}</div></div>`).join('')}</div><div class="formfoot">${button('Hủy','cancel')}${button('Lưu '+(isNew?'câu hỏi':'thay đổi'),'save','primary')}</div></form>${isNew?`<aside><div class="card"><h3>Cấu trúc Part ${r.part}</h3><p class="hint">${r.part===3||r.part===4?'Một nhóm gồm 3 câu.':r.part===6?'Một nhóm gồm 4 câu.':r.part===7?'Một nhóm gồm 2–5 câu, có 1–3 tài liệu.':'Một câu độc lập.'}</p><div class="warning">Lưu ở đây chỉ cập nhật dữ liệu mẫu trong trình duyệt, không tạo câu thật trên Azure SQL.</div></div></aside>`:sideUsage(r)}</div>`;}
function draftFor(partNum){const group=[3,4,6,7].includes(partNum);const count=partNum===3||partNum===4?3:partNum===6?4:partNum===7?2:1;return {id:'temp',bank,part:partNum,kind:group?'group':'single',name:'Câu mới',description:'Nội dung mới',media:partNum===7?'Tài liệu đọc':partNum===1?'Ảnh + âm thanh':partNum===2||partNum===3||partNum===4?'Audio':'Không cần media',shared:'',translation:'',document:partNum===7?{type:'TEXT',title:'',body:'',headers:['Category','Item','Value'],rows:[]}:null,questions:Array.from({length:count},(_,i)=>({id:'mới-'+(i+1),text:'',options:Array.from({length:partNum===2?3:4},()=>''),correct:0,difficulty:'Trung bình',explain:''})),usage:[]}}
function show(){const page=$('#page');page.innerHTML=view==='list'?list():view==='detail'&&!editing?details():form(draft,view==='add');if(view!=='list'&&(view==='add'||editing)&&draft?.part===7)renderDocSpecial();}
function renderDocSpecial(){const el=$('#doc-special');if(!el)return;let d=draft.document||{type:'TEXT',title:'',body:'',headers:['','',''],rows:[]};const type=$('#doctype')?.value||d.type;const v=(x)=>escape(x);if(type==='TABLE'){el.innerHTML=`<div class="sectionlabel">Bảng dữ liệu</div><div class="formgrid">${[0,1,2].map(j=>formField('Tên cột '+(j+1),'h-'+j,d.headers?.[j]||'')).join('')}</div><div id="table-rows" style="margin-top:11px">${(d.rows||[]).map((row,i)=>`<div class="formgrid" style="margin-bottom:8px">${[0,1,2].map(j=>formField('Hàng '+(i+1)+' · Cột '+(j+1),'cell-'+i+'-'+j,row[j]||'')).join('')}</div>`).join('')}</div>${button('＋ Thêm hàng','row-add','small')}`;}else if(type==='EMAIL'){el.innerHTML=`<div class="formgrid">${['From','To','Date','Subject'].map(t=>formField(t,t.toLowerCase(),d[t.toLowerCase()]||'')).join('')}</div>`}else if(type==='CHAT'){el.innerHTML=formField('Tin nhắn (trình bày theo danh sách có người gửi/thời gian)','messages',d.messages||'',{textarea:true})}else if(type==='FORM'){el.innerHTML=formField('Các trường biểu mẫu (nhãn / giá trị)','fields',d.fields||'',{textarea:true})}else if(type==='IMAGE'){el.innerHTML=`<div class="media-tile">Chọn ảnh tài liệu<input type="file" accept="image/*"></div>`;}else el.innerHTML='<p class="notice">Loại TEXT sử dụng nội dung văn bản ở phía trên.</p>';}
function collect(){const form=$('#editor');if(!form)return null;const fd=new FormData(form),r=JSON.parse(JSON.stringify(draft));r.shared=fd.get('shared')??r.shared;r.bank=fd.get('bank')||r.bank;for(let i=0;i<r.questions.length;i++){const q=r.questions[i];q.text=String(fd.get('text-'+i)||'').trim();q.options=q.options.map((_,j)=>String(fd.get('opt-'+i+'-'+j)||'').trim());q.correct=Number(fd.get('correct-'+i)||0);q.difficulty=fd.get('difficulty-'+i)||'Trung bình';q.explain=String(fd.get('explain-'+i)||'').trim();}if(r.part===7){r.document={...(r.document||{}),type:fd.get('doctype'),title:fd.get('doctitle'),body:fd.get('docbody')};if(r.document.type==='TABLE'){r.document.headers=[0,1,2].map(j=>fd.get('h-'+j)||'');r.document.rows=(draft.document.rows||[]).map((row,i)=>[0,1,2].map(j=>fd.get('cell-'+i+'-'+j)||''));}for(const z of ['from','to','date','subject','messages','fields'])if(fd.has(z))r.document[z]=fd.get(z);}if(!r.questions.every(q=>q.text&&q.options.every(Boolean)&&q.explain)){notify('Vui lòng nhập nội dung, các đáp án và giải thích trước khi lưu.',true);return null}return r;}
function notify(message,error){clearTimeout(toastTimer);$('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=message;if(error)n.style.background='#a3383e';document.body.append(n);toastTimer=setTimeout(()=>n.remove(),3500)}
function enterDetail(id){selected=id;editing=false;draft=null;view='detail';show()}
function save(){const next=collect();if(!next)return;if(view==='add'){const nextId=Date.now().toString(36);next.id='u'+nextId;const nextQid=1000+data.reduce((v,r)=>Math.max(v,...r.questions.map(q=>Number(q.id)||0)),0);next.questions.forEach((q,i)=>q.id=nextQid+i);next.name=next.kind==='group'?'Nhóm mới '+nextId.slice(-3):'Câu '+nextQid;next.description=next.questions[0]?.text?.slice(0,75)||'Câu hỏi mới';data.unshift(next);selected=next.id;view='detail';editing=false;draft=null;notify('Đã thêm vào dữ liệu minh họa. Không ghi Azure SQL.');show();}else{const at=data.findIndex(q=>q.id===selected);if(at<0)return;next.id=selected;next.description=next.questions[0]?.text?.slice(0,75)||data[at].description;data[at]=next;editing=false;draft=null;notify('Đã cập nhật bản minh họa. Không ghi Azure SQL.');show();}}
function initAdd(){view='add';editing=false;draft=draftFor(5);show()}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-bank]');if(tab){bank=tab.dataset.bank;filter='';shape='all';part='all';view='list';editing=false;show();return;}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='list'){view='list';editing=false;draft=null;show()}else if(a==='detail'||a.startsWith('detail:'))enterDetail(a.split(':')[1]);else if(a==='add')initAdd();else if(a==='edit'){draft=JSON.parse(JSON.stringify(item()));editing=true;show();}else if(a==='cancel'){if(view==='add'){view='list';draft=null}else{editing=false;draft=null}show()}else if(a==='save')save();else if(a==='delete'){modal=true;$('#modal').innerHTML=`<div class="modalbg"><div class="modal"><h2>Xóa vĩnh viễn ${escape(item().name)}?</h2><p>Trong bản minh họa, thao tác này chỉ xóa mục khỏi danh sách dữ liệu mẫu trên trình duyệt, không xóa bản ghi thật hay ảnh hưởng đề thi STO123.</p><div class="warning">Khi triển khai thật, backend phải bảo vệ snapshot, bài đang làm và lịch sử trước khi cho phép Hard Delete.</div><div class="formfoot" style="padding-bottom:0">${button('Hủy','modal-cancel')}${button('Xác nhận xóa mẫu','modal-delete','danger')}</div></div></div>`}else if(a==='modal-cancel'){$('#modal').innerHTML='';modal=false}else if(a==='modal-delete'){data=data.filter(r=>r.id!==selected);$('#modal').innerHTML='';modal=false;view='list';editing=false;show();notify('Đã xóa khỏi dữ liệu minh họa. Không ghi Azure SQL.')}else if(a==='row-add'){const f=$('#editor');if(f){const fd=new FormData(f);draft.shared=fd.get('shared')??draft.shared;draft.document={...(draft.document||{}),type:fd.get('doctype'),title:fd.get('doctitle'),body:fd.get('docbody')};draft.document.headers=[0,1,2].map(j=>fd.get('h-'+j)||'');draft.document.rows=(draft.document.rows||[]).map((row,i)=>[0,1,2].map(j=>fd.get('cell-'+i+'-'+j)||''));draft.questions.forEach((q,i)=>{q.text=fd.get('text-'+i)||'';q.options=q.options.map((_,j)=>fd.get('opt-'+i+'-'+j)||'');q.correct=Number(fd.get('correct-'+i)||0);q.difficulty=fd.get('difficulty-'+i)||'Trung bình';q.explain=fd.get('explain-'+i)||'';});draft.document.rows.push(['','','']);show();}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const position=e.target.selectionStart;filter=e.target.value;show();const n=$('#search');n?.focus();n?.setSelectionRange(position,position);}});
document.addEventListener('change',e=>{if(e.target.id==='shape'){shape=e.target.value;show()}else if(e.target.id==='part'){part=e.target.value;show()}else if(e.target.id==='editpart'){if(view!=='add')return;bank=$('#editor [name=bank]').value;draft=draftFor(Number(e.target.value));show()}else if(e.target.id==='doctype'){if(!draft)return;draft.document.type=e.target.value;renderDocSpecial();}});
show();
})();
</script><div id="modal"></div>
</body></html>
