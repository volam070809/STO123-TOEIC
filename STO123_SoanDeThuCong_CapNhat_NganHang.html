<style>

pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.pagehead h1{font-size:25px;line-height:1.25;letter-spacing:-.7px;margin:0 0 7px}.pagehead p{margin:0;font-size:12px;color:var(--muted);line-height:1.65;max-width:650px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfdaea;border-radius:8px;background:#fff;color:#284669;font-weight:650;font-size:12px;padding:10px 14px;white-space:nowrap}.btn:hover{background:#f0f6ff}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#2057a8}.btn.danger{color:#b74444;border-color:#e8c3c3}.btn.sm{padding:7px 10px;font-size:11px}.btn.ghost{border-color:transparent;background:transparent}.btn.warning{background:var(--amberbg);color:#935c18;border-color:#ecd8b6}.card{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden;margin-bottom:15px}.cardpad{padding:19px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:15px}.sectionhead h2{font-size:15px;margin:0;letter-spacing:-.2px}.sectionhead p{font-size:11px;color:var(--muted);margin:4px 0 0}.muted{color:var(--muted);font-size:11px}.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:740;border-radius:5px;padding:4px 8px;background:var(--bluebg);color:#3266ae}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.gray{background:#f2f4f6;color:#66778e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px}.stat strong{font-size:26px;letter-spacing:-.5px;display:block;margin:7px 0 3px}.stat span{color:var(--muted);font-size:11px}.examrow{display:grid;grid-template-columns:minmax(0,1fr) 175px 155px;gap:20px;align-items:center;padding:19px 22px;border-top:1px solid #eaf0f6}.examrow:first-of-type{border-top:0}.examrow h3{font-size:14px;margin:0 0 5px}.examrow .progress{width:100%;height:7px;background:#e8eef7;border-radius:10px;overflow:hidden;margin-top:9px}.progress b{display:block;height:100%;background:#2d75c4;transition:width .2s}.examrow .right{text-align:right}.miniinfo{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:11px}.editorgrid{display:grid;grid-template-columns:210px minmax(0,1fr) 235px;gap:13px;align-items:start}.parts{padding:9px}.partbtn{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 11px;border:0;border-radius:8px;background:#fff;color:var(--ink);margin:2px 0;font-weight:700;font-size:12px}.partbtn small{font-size:10px;color:var(--muted);font-weight:600}.partbtn.active{background:var(--bluebg);color:#2356a7}.partbtn.active small{color:#356bb7}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:13px 16px;border-top:1px solid #edf1f6}.item:first-child{border-top:0}.item strong{font-size:12px}.item p{font-size:11px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemactions{display:flex;gap:5px}.counter{font-size:26px;font-weight:800;line-height:1.3}.counter small{font-weight:500;font-size:14px;color:var(--muted)}.checkrow{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#60718a;margin-top:13px}.hr{height:1px;background:var(--border);margin:15px 0}.explainer{font-size:11px;line-height:1.65;color:var(--muted)}.formwrap{max-width:1000px;margin:auto}.label{font-size:11px;font-weight:750;color:#304864;display:block;margin-bottom:7px}.field{border:1px solid #d7e1ee;border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;outline:none;min-width:0}.field:focus{border-color:#4484d2;box-shadow:0 0 0 3px #e6f0ff}.field[disabled]{background:#f4f6fa}.fieldarea{min-height:84px;resize:vertical;line-height:1.55}.fg{margin-bottom:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.groupcards{display:grid;gap:11px}.qbox{border:1px solid var(--border);border-radius:9px;padding:16px;background:#fff}.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.qhead strong{font-size:12px}.tip{padding:11px 13px;background:#f0f6ff;border-left:3px solid #6c9edc;color:#536f98;border-radius:5px;font-size:11px;line-height:1.6;margin:12px 0}.warning{padding:12px 13px;background:#fff7ec;color:#8d621c;border:1px solid #f0dfbc;border-radius:8px;font-size:11px;line-height:1.6;margin-bottom:12px}.empty{text-align:center;padding:55px 16px;color:#7889a0}.empty strong{display:block;font-size:14px;color:#2d4260;margin:0 0 5px}.empty p{font-size:12px;margin:0 0 14px}.itempanel{padding:0}.detailbar{background:#f9fbfe;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.detailbar strong{font-size:13px}.docpreview{line-height:1.7;font-size:12px}.docpreview table{border-collapse:collapse;width:100%;font-size:11px;margin:12px 0}.docpreview td,.docpreview th{border:1px solid var(--border);padding:9px;text-align:left}.docpreview th{background:#f5f8fc}.answer{padding:9px;margin:5px 0;background:#f7f9fc;border-radius:6px;border:1px solid #edf1f5;font-size:12px}.answer.correct{background:#ebf9f1;border-color:#b5e4c9;color:#18704b;font-weight:700}.questiondetail{border-top:1px solid var(--border);padding:16px}.questiondetail:first-child{border:0}.fieldnote{color:var(--muted);font-size:10px;margin-top:5px}.doccard{border:1px solid var(--border);border-radius:9px;padding:15px;margin-bottom:13px}.doccardtitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.doccardtitle strong{font-size:12px}.barrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.gridscroll{overflow-x:auto}.footbar{background:#fff;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;margin-top:15px}.toast{position:fixed;right:25px;bottom:20px;z-index:20;max-width:420px;background:#173957;color:#fff;border-radius:10px;padding:13px 17px;box-shadow:0 8px 30px #09274730;font-size:12px;line-height:1.55}.table{border-collapse:collapse;width:100%;min-width:600px}.table th,.table td{text-align:center;border-bottom:1px solid var(--border);padding:11px 8px;font-size:12px}.table th:first-child,.table td:first-child{text-align:left}.table th{background:#f8fafd;font-size:11px;color:#67809b}.numfield{width:84px;text-align:center}.confirmshade{position:fixed;inset:0;background:#14243b90;z-index:30;display:grid;place-items:center;padding:15px}.confirm{max-width:440px;width:100%;background:#fff;border-radius:12px;padding:24px}.confirm h3{margin-top:0}.confirm p{font-size:12px;line-height:1.7;color:#667c95}.square{display:grid;grid-template-columns:1fr 1fr;gap:8px}.square .field{font-size:11px}.hidden{display:none!important}
@media(max-width:1200px){.editorgrid{grid-template-columns:185px minmax(0,1fr)}.editorgrid>.sidebarcard{grid-column:1/-1}.workspace{padding:24px}.examrow{grid-template-columns:minmax(0,1fr) 140px 130px}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static}.brand{padding:10px 14px}.nav{display:flex;overflow-x:auto;padding:7px}.nav button{white-space:nowrap;padding:9px 11px}.sidefoot{display:none}.topbar{height:52px;padding:0 14px}.workspace{padding:18px 12px}.pagehead{flex-direction:column}.pagehead h1{font-size:22px}.stats{grid-template-columns:1fr 1fr}.editorgrid{grid-template-columns:1fr}.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.partbtn{flex-direction:column;gap:4px;text-align:center}.examrow{grid-template-columns:1fr}.examrow .right{text-align:left}.formgrid{grid-template-columns:1fr}.footbar{flex-direction:column;align-items:stretch}}

<body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandlogo">STO</div><div><strong>STO123</strong><small>Quản trị nội dung</small></div></div><nav class="nav"><button id="nav-exams" data-action="nav-exams" class="active">▣ &nbsp; Quản lý đề thi</button><button id="nav-bank" data-action="nav-bank">▤ &nbsp; Ngân hàng câu hỏi đề thi</button><button id="nav-criteria" data-action="nav-criteria">▤ &nbsp; Cấu hình sinh đề</button></nav><div class="sidefoot">Bản mô phỏng giao diện<br>Không kết nối Azure SQL hoặc API.</div></aside><div class="main"><header class="topbar"><div><strong id="top-name">Quản lý đề thi</strong><small>STO123 / Admin</small></div><div class="profile"><div class="avatar">AD</div><span>Admin demo</span></div></header><div class="workspace" id="app"></div></div></div>
<script>
(function(){
const KEY='sto123_manual_exam_demo_v5_bank';
const limits=[0,6,25,39,30,30,16,54];
const labels=['','Photographs','Question–Response','Conversations','Short Talks','Incomplete Sentences','Text Completion','Reading Comprehension'];
const clone=x=>JSON.parse(JSON.stringify(x));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankQuestion=(i=0)=>({id:'q-'+Date.now()+'-'+i+'-'+Math.floor(Math.random()*99999),text:'',answers:['','','',''],correct:0,difficulty:'Trung bình',explanation:''});
const makeUnit=(part)=>({id:'u-'+Date.now()+'-'+Math.floor(Math.random()*100000),part,shared:'',translation:'',audio:'',image:'',passage:'',documents:part===7?[makeDoc('TEXT')]:[],questions:Array.from({length:part===3||part===4?3:part===6?4:part===7?2:1},(_,i)=>blankQuestion(i))});
function makeDoc(type){return {id:'doc-'+Math.floor(Math.random()*1e8),type,title:'',body:'',from:'',to:'',date:'',subject:'',headers:['Cột 1','Cột 2'],rows:[['','']],messages:[{sender:'',time:'',text:''}],fields:[{label:'',value:''}],image:''}}
function seedQuestion(part,j){const q=blankQuestion(j);q.text=part===1?'Which statement best describes the photograph?':part===2?'Choose the best response.':part===5?'The manager _____ the documents before Friday.':part===6?'Choose the correct answer for blank ('+(j+1)+').':part===7?'What is indicated in the document?':'What is the speaker talking about?';q.answers=part===2?['At nine o’clock.','In the office.','Yes, she did.','']:['The correct option.','An alternative answer.','Another possible answer.','A final possible answer.'];q.correct=0;q.explanation='Giải thích đáp án theo ngữ liệu.';return q;}
function seededUnit(part){const u=makeUnit(part);u.questions=u.questions.map((_,i)=>seedQuestion(part,i));u.shared=part===3?'W: We need to reschedule the meeting.\nM: How about Friday?':part===4?'Good afternoon. Today we will discuss the quarterly sales.':'';u.audio=part<=4?'audio-minh-hoa.mp3':'';u.image=part===1?'photo-minh-hoa.png':'';u.passage=part===6?'Dear members,\nPlease review [1] documents and submit [2] comments. The new policy [3] next week. Thank you [4] your cooperation.':'';if(part===7)u.documents=[{...makeDoc('TABLE'),title:'Harbis Stationery Store',headers:['Item','Discount'],rows:[['Seasonal cards','25%'],['Invitations','50%']]}];return u}
function makeExam(id,name,items,status){return{id,name,status,items,updated:new Date().toISOString()}}
function initialState(){const d=makeExam('draft-demo','TOEIC 2026 — Đề đang biên soạn',{1:[seededUnit(1),seededUnit(1)],3:[seededUnit(3)],5:[seededUnit(5),seededUnit(5)],7:[seededUnit(7)]},'editing');let published={};for(let p=1;p<=7;p++){const size=p===3||p===4?3:p===6?4:1;const per=p===7?3:size;published[p]=[];let left=limits[p];while(left>0){const u=seededUnit(p);if(p===7)u.questions=Array.from({length:Math.min(3,left)},(_,i)=>seedQuestion(p,i));published[p].push(u);left-=u.questions.length;}}const exams=[makeExam('ets-2023','ETS 2023 — Test 01',published,'published'),d];return{exams,seq:100,bank:buildBank(exams)};}
function buildBank(exams){const bank={};for(const e of exams){for(const [p,units] of Object.entries(e.items)){for(const u of units){const item=bank[u.id];if(item){if(!item.examIds.includes(e.id))item.examIds.push(e.id);}else bank[u.id]={id:u.id,part:Number(p),unit:clone(u),examIds:[e.id],updated:e.updated};}}}return bank;}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initialState()}catch{state=initialState()};
if(!state.bank)state.bank=buildBank(state.exams);
let view='exams',examId='draft-demo',part=1,editor=null,editorMode='add',editDirty=false,selectedId=null,confirmDelete=null,toaster='';
const app=document.querySelector('#app');
const active=()=>state.exams.find(e=>e.id===examId);
const units=(exam,p)=>exam.items[String(p)]||[];
const count=(exam,p)=>units(exam,p).reduce((s,u)=>s+u.questions.length,0);
const total=exam=>limits.slice(1).reduce((s,_,i)=>s+count(exam,i+1),0);
const percent=n=>Math.min(100,Math.round(n/200*100));
const store=()=>{localStorage.setItem(KEY,JSON.stringify(state))};
const btn=(text,action,style='')=>`<button type="button" class="btn ${style}" data-action="${action}">${text}</button>`;
function notify(msg){const old=document.querySelector('.toast');if(old)old.remove();let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),3700)}
function statusBadge(e){return e.status==='published'?'<span class="pill green">Đang mở</span>':'<span class="pill amber">Đang biên soạn</span>'}
function go(next){if(editDirty&&!confirm('Có nội dung trong form chưa lưu. Bạn muốn bỏ phần đang nhập?'))return;editDirty=false;editor=null;view=next;render()}
function pagehead(title,sub,acts=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${acts}</div></div>`}
function examsPage(){const opened=state.exams.filter(e=>e.status==='published').length,editing=state.exams.length-opened;return `<div class="crumb">Quản trị <span>›</span> Quản lý đề thi</div>${pagehead('Quản lý đề thi','Mỗi đề có một nội dung hiện hành. Có thể biên soạn dần và quay lại hoàn thiện trước khi xuất bản.',btn('＋ Soạn đề thủ công','create','primary'))}<div class="stats"><div class="stat"><span>Tổng đề thi</span><strong>${state.exams.length}</strong><span>Đã tạo trong bản mô phỏng</span></div><div class="stat"><span>Đề đang mở</span><strong>${opened}</strong><span>Học viên có thể bắt đầu</span></div><div class="stat"><span>Đang biên soạn</span><strong>${editing}</strong><span>Lưu dần, chưa cho học viên thi</span></div></div><div class="card"><div class="cardpad"><div class="sectionhead"><div><h2>Danh sách đề</h2><p>Nhấn Tiếp tục biên soạn để mở lại đề chưa hoàn thành.</p></div></div></div>${state.exams.map(e=>`<div class="examrow"><div><h3>${escapeHTML(e.name)} ${statusBadge(e)}</h3><div class="miniinfo"><span>Mã demo: ${escapeHTML(e.id)}</span><span>${total(e)} / 200 câu</span><span>120 phút</span></div><div class="progress"><b style="width:${percent(total(e))}%"></b></div></div><div class="muted">${e.status==='published'?'Nội dung hiện hành, không có lịch sử phiên bản':'Được phép thoát và vào tiếp nhiều lần'}<br>Cập nhật: ${new Date(e.updated).toLocaleString('vi-VN')}</div><div class="right">${btn(e.status==='published'?'Xem và chỉnh sửa':'Tiếp tục biên soạn','open:'+e.id,'primary')}</div></div>`).join('')}</div><div class="tip">Trước khi xuất bản: có thể lưu các Part chưa đủ 200 câu. Sau khi xuất bản: muốn thay đổi đề, Admin sửa trực tiếp; lượt học viên đã bắt đầu phải được backend giữ nội dung độc lập.</div>`}
function partsList(e){return `<div class="card parts">${limits.slice(1).map((max,i)=>{const p=i+1,c=count(e,p);return `<button class="partbtn ${part===p?'active':''}" data-action="part:${p}"><span>Part ${p}</span><small>${c}/${max}</small></button>`}).join('')}</div>`}
function bankPage(){const entries=Object.values(state.bank||{}).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));const questionCount=entries.reduce((sum,b)=>sum+b.unit.questions.length,0);return `<div class="crumb">Quản trị › Ngân hàng câu hỏi đề thi</div>${pagehead('Ngân hàng câu hỏi đề thi', 'Các câu/nhóm do Admin tạo trực tiếp khi soạn đề đều được lưu tại đây. Màn hình này chỉ xem, không dùng để chọn câu có sẵn vào đề.',btn('← Quản lý đề','nav-exams'))}<div class="stats"><div class="stat"><span>Tổng câu hỏi</span><strong>${questionCount}</strong><span>Từ các nhóm/câu đã lưu</span></div><div class="stat"><span>Nhóm / câu nguồn</span><strong>${entries.length}</strong><span>Đơn vị lưu DE_THI</span></div><div class="stat"><span>Ngân hàng</span><strong style="font-size:22px">DE_THI</strong><span>Không phải LUYEN_TAP</span></div></div><div class="card"><div class="cardpad"><div class="sectionhead"><div><h2>Các câu/nhóm đã lưu vào ngân hàng</h2><p>Gỡ khỏi đề chỉ bỏ liên kết, không xóa nội dung nguồn. Bản demo hiển thị các mục cập nhật gần nhất.</p></div></div></div>${entries.slice(0,45).map(b=>{const related=b.examIds.map(id=>state.exams.find(e=>e.id===id)?.name).filter(Boolean);return `<div class="examrow"><div><h3>${b.unit.questions.length>1?'Nhóm câu':'Câu riêng'} · Part ${b.part} <span class="pill green">DE_THI</span></h3><div class="miniinfo"><span>${b.unit.questions.length} câu</span><span>Định danh: ${escapeHTML(b.id)}</span></div><p class="muted">${escapeHTML(b.unit.questions[0]?.text||'Nội dung chưa có mô tả')}</p></div><div class="muted">${related.length?'Thuộc đề: '+related.map(escapeHTML).join(', '):'Không thuộc đề nào · vẫn còn trong ngân hàng'}</div><div class="right"><span class="pill gray">Đã lưu nguồn</span></div></div>`}).join('')}</div><div class="tip">Khi triển khai STO123 thật: mỗi lần nhấn Lưu vào Part phải tạo/cập nhật nguồn trong ngân hàng DE_THI và liên kết với đề trong cùng một giao dịch. Dữ liệu ở đây chỉ mô phỏng trên trình duyệt.</div>`;}
function composerPage(){const e=active();if(!e){view='exams';return examsPage()}const c=count(e,part),tt=total(e),items=units(e,part),published=e.status==='published';return `<div class="crumb"><span data-action="nav-exams" style="cursor:pointer">Quản lý đề thi</span><span>›</span>${escapeHTML(e.name)}</div>${pagehead(escapeHTML(e.name),published?'Chỉnh sửa trực tiếp nội dung hiện hành. Không có V1/V2 hay trang lịch sử phiên bản.':'Tạo câu/nhóm trực tiếp theo Part; khi lưu sẽ đồng thời vào ngân hàng câu hỏi đề thi và được gắn vào đề này.',`${btn('← Danh sách đề','nav-exams')}${btn('Lưu tiến độ','save-progress','primary')}`)}<div class="editorgrid">${partsList(e)}<div><div class="card"><div class="cardpad"><div class="sectionhead"><div><h2>Part ${part} · ${labels[part]}</h2><p>${c} / ${limits[part]} câu · ${items.length} đơn vị nội dung</p></div>${btn('＋ '+(part===3||part===4||part===6||part===7?'Thêm nhóm câu mới':'Thêm câu mới'),'add-unit','primary')}</div><div class="tip">${part<=2||part===5?'Mỗi lần thêm một câu riêng, nhập trực tiếp nội dung, đáp án, giải thích và media cần thiết.':'Tạo nhóm trực tiếp. Lưu một lần để thêm nhóm/các câu vào ngân hàng DE_THI và liên kết vào Part; không chọn từ ngân hàng có sẵn.'}</div></div>${items.length?`<div class="itempanel">${items.map((u,i)=>`<div class="item"><div><strong>${part<=2||part===5?'Câu '+(i+1):'Nhóm '+(i+1)} · ${u.questions.length} câu</strong> <span class="pill gray">${u.questions.length} câu</span> <span class="pill green">Đã lưu DE_THI</span><p>${escapeHTML(u.questions[0]?.text||'Chưa có mô tả')}</p></div><div class="itemactions">${btn('Xem','inspect:'+u.id,'sm')}${btn('Sửa','edit:'+u.id,'sm')}${btn('Gỡ','remove:'+u.id,'sm danger')}</div></div>`).join('')}</div>`:`<div class="empty card"><strong>Part ${part} chưa có câu nào</strong><p>Nhấn Thêm để tạo câu/nhóm mới ngay tại đây.</p>${btn('＋ Thêm câu hỏi','add-unit','primary')}</div>`}</div><div class="card cardpad sidebarcard"><div class="sectionhead"><div><h2>Tiến độ đề</h2><p>Được lưu giữa các lần truy cập.</p></div>${statusBadge(e)}</div><div class="counter">${tt}<small> / 200 câu</small></div><div class="progress" style="height:8px;background:#e6edf7;border-radius:5px;overflow:hidden;margin:11px 0"><b style="height:100%;display:block;background:#3b76ca;width:${percent(tt)}%"></b></div>${limits.slice(1).map((max,i)=>{const p=i+1,c=count(e,p);return `<div class="checkrow"><span>Part ${p}</span><b style="color:${c===max?'#18836a':c>max?'#bf5252':'#486181'}">${c} / ${max}</b></div>`}).join('')}<div class="hr"></div>${tt===200&&limits.slice(1).every((n,i)=>count(e,i+1)===n)?`<div class="tip">Đã đủ số câu. Có thể xuất bản sau khi kiểm tra nội dung.</div>`:`<div class="warning">Chưa đủ cấu trúc 200 câu. Bạn có thể lưu tiến độ và quay lại hoàn thiện.</div>`}${published?`<div class="tip">Đề đang mở. Thay đổi đã Lưu sẽ cập nhật nội dung hiện hành cho lượt mới. Lượt đã bắt đầu cần giữ snapshot riêng ở backend.</div>`:btn('Xuất bản cho học viên','publish','primary')}<p class="explainer" style="margin-top:13px">Bản demo lưu trong trình duyệt. STO123 thật phải lưu câu vào ngân hàng DE_THI và liên kết đề trong Azure SQL, không dùng localStorage.</p></div></div>`}
function docEditor(d,i){const t=d.type;let fields='';const input=(key,label,kind='input')=>`<div class="fg"><label class="label">${label}</label>${kind==='textarea'?`<textarea class="field fieldarea" data-doc="${i}" data-prop="${key}">${escapeHTML(d[key]||'')}</textarea>`:`<input class="field" data-doc="${i}" data-prop="${key}" value="${escapeHTML(d[key]||'')}">`}</div>`;if(t==='TEXT')fields=input('body','Nội dung tài liệu','textarea');if(t==='EMAIL')fields=`<div class="formgrid">${input('from','Người gửi (From)')}${input('to','Người nhận (To)')}${input('date','Ngày gửi')}${input('subject','Tiêu đề (Subject)')}</div>${input('body','Nội dung email','textarea')}`;if(t==='TABLE')fields=`${input('title','Tiêu đề bảng')}<div class="gridscroll"><table class="table"><thead><tr>${d.headers.map((v,j)=>`<th><input class="field" data-doc="${i}" data-header="${j}" value="${escapeHTML(v)}" aria-label="Tiêu đề cột ${j+1}"></th>`).join('')}<th></th></tr></thead><tbody>${d.rows.map((r,ri)=>`<tr>${r.map((v,j)=>`<td><input class="field" data-doc="${i}" data-row="${ri}" data-col="${j}" value="${escapeHTML(v)}"></td>`).join('')}<td>${btn('×','del-row:'+i+':'+ri,'sm danger')}</td></tr>`).join('')}</tbody></table></div><div class="barrow">${btn('＋ Thêm hàng','add-row:'+i,'sm')}${btn('＋ Thêm cột','add-col:'+i,'sm')}</div>`;if(t==='CHAT')fields=`${input('title','Tên cuộc hội thoại')}${d.messages.map((m,j)=>`<div class="doccard"><div class="doccardtitle"><strong>Tin nhắn ${j+1}</strong>${btn('Xóa','del-msg:'+i+':'+j,'sm danger')}</div><div class="formgrid"><div class="fg"><label class="label">Người gửi</label><input class="field" data-doc="${i}" data-msg="${j}" data-mfield="sender" value="${escapeHTML(m.sender)}"></div><div class="fg"><label class="label">Thời gian</label><input class="field" data-doc="${i}" data-msg="${j}" data-mfield="time" value="${escapeHTML(m.time)}"></div></div><div class="fg"><label class="label">Nội dung</label><textarea class="field fieldarea" data-doc="${i}" data- function unitEditor(){const e=active(),p=part,u=editor;const label=editorMode==='add'?'Thêm mới':'Chỉnh sửa';const n=u.questions.length;return `<div class="crumb"><span style="cursor:pointer" data-action="nav-exams">Quản lý đề thi</span> › <span style="cursor:pointer" data-action="back-composer">${escapeHTML(e.name)}</span> › Part ${p} › ${label}</div>${pagehead(`${label} ${p===3||p===4||p===6||p===7?'nhóm câu':'câu hỏi'} · Part ${p}`,'Nhập trực tiếp nội dung mới; bấm Lưu vào Part sẽ đồng thời lưu câu/nhóm vào ngân hàng DE_THI. Không chọn câu đã có.',`${btn('← Quay lại đề','back-composer')}`)}<div class="formwrap"><div class="card cardpad"><div class="sectionhead"><div><h2>Ngữ liệu theo đúng Part ${p}</h2><p>${labels[p]} · ${p===7?'2–5 câu, 1–3 tài liệu':p===3||p===4?'3 câu, một audio chung':p===6?'4 câu, đoạn văn với 4 chỗ trống':'Một câu độc lập'}</p></div><span class="pill">Part ${p}</span></div>
${p===1||p===2||p===3||p===4?`<div class="formgrid"><div class="fg"><label class="label">Audio ${p<=4?'(bắt buộc)':''}</label><input type="file" class="field" accept="audio/*" data-media="audio"><div class="fieldnote">${escapeHTML(u.audio||'Chưa chọn file')} · File demo chỉ lưu tên</div></div>${p===1?`<div class="fg"><label class="label">Ảnh mô tả (bắt buộc)</label><input type="file" class="field" accept="image/*" data-media="image"><div class="fieldnote">${escapeHTML(u.image||'Chưa chọn ảnh')}</div></div>`:''}</div>`:''}
${p===3||p===4?`<div class="fg"><label class="label">${p===3?'Hội thoại chung — mỗi lượt nói xuống dòng':'Bài nói / bài thuyết trình'}</label><textarea class="field fieldarea" data-unit="shared" style="min-height:125px" placeholder="${p===3?'W: ...\nM: ...':'Good morning, ...'}">${escapeHTML(u.shared)}</textarea></div>`:''}
${p===6?`<div class="fg"><label class="label">Đoạn văn chứa bốn chỗ trống [1], [2], [3], [4]</label><textarea class="field fieldarea" data-unit="passage" style="min-height:150px" placeholder="Nhập đoạn văn với [1], [2], [3], [4] theo đúng thứ tự">${escapeHTML(u.passage)}</textarea><div class="fieldnote">Kiểm tra định dạng chỗ trống trước khi lưu. Không chuyển passage thành văn bản mất đánh số.</div></div>`:''}
${p===7?`<div class="sectionhead" style="margin-top:9px"><div><h2>Tài liệu đọc có cấu trúc</h2><p>1–3 tài liệu, không nhập JSON thô.</p></div>${btn('＋ Thêm tài liệu','add-doc','sm')}</div>${u.documents.map(docEditor).join('')}`:''}
${[3,4,6].includes(p)?`<div class="fg"><label class="label">Bản dịch ngữ liệu (nếu được hệ thống sử dụng)</label><textarea class="field fieldarea" data-unit="translation">${escapeHTML(u.translation)}</textarea></div>`:''}
</div><div class="card cardpad"><div class="sectionhead"><div><h2>Câu hỏi và đáp án</h2><p>Chỉnh từng câu; nhóm được lưu đồng thời và giữ nguyên liên kết chung.</p></div>${p===7?`<div class="barrow">${btn('＋ Câu','add-question','sm')}${btn('− Câu','remove-question','sm')}</div>`:`<span class="pill gray">${n} câu</span>`}</div><div class="groupcards">${u.questions.map((q,i)=>`<div class="qbox"><div class="qhead"><strong>Câu ${i+1} ${p===6?'— Chỗ trống ['+(i+1)+']':''}</strong><span class="muted">${escapeHTML(q.difficulty)}</span></div><div class="fg"><label class="label">Nội dung câu hỏi</label><textarea class="field fieldarea" data-q="${i}" data-qfield="text" placeholder="Nội dung câu ${i+1} ...">${escapeHTML(q.text)}</textarea></div><div class="formgrid">${Array.from({length:p===2?3:4},(_,j)=>`<div class="fg"><label class="label">Phương án ${'ABCD'[j]}</label><input class="field" data-q="${i}" data-answer="${j}" value="${escapeHTML(q.answers[j]||'')}"></div>`).join('')}</div><div class="formgrid"><div class="fg"><label class="label">Đáp án đúng</label><select class="field" data-q="${i}" data-qfield="correct">${Array.from({length:p===2?3:4},(_,j)=>`<option value="${j}" ${q.correct===j?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select></div><div class="fg"><label class="label">Độ khó</label><select class="field" data-q="${i}" data-qfield="difficulty">${['Dễ','Trung bình','Khó'].map(v=>`<option ${q.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="fg"><label class="label">Giải thích</label><textarea class="field fieldarea" data-q="${i}" data-qfield="explanation">${escapeHTML(q.explanation)}</textarea></div></div>`).join('')}</div></div><div class="footbar"><span class="muted">${n} câu · Lưu đồng thời vào ngân hàng DE_THI và Part ${p} (${count(e,p)}/${limits[p]} hiện có)</span><div class="actions">${btn('Hủy','back-composer')}${btn('Điền mẫu để thử','fill-demo','warning')}${btn('Lưu vào Part '+p,'save-unit','primary')}</div> function showUnit(){const e=active(),u=units(e,part).find(x=>x.id===selectedId);if(!u){view='composer';return composerPage()}const p=part;const questionHTML=u.questions.map((q,i)=>`<div class="questiondetail"><strong>Câu ${i+1}</strong><p style="font-size:13px">${escapeHTML(q.text)}</p>${q.answers.slice(0,p===2?3:4).map((a,j)=>`<div class="answer ${q.correct===j?'correct':''}">${'ABCD'[j]}. ${escapeHTML(a)} ${q.correct===j?'✓ Đáp án đúng':''}</div>`).join('')}<div class="muted" style="margin-top:9px">${escapeHTML(q.difficulty)} · ${escapeHTML(q.explanation)}</div></div>`).join('');const doc=u.documents?.map((d,i)=>`<div class="doccard"><strong>Tài liệu ${i+1} · ${d.type}</strong><div class="docpreview" style="margin-top:8px">${d.type==='TABLE'?`<p>${escapeHTML(d.title)}</p><table><thead><tr>${d.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map(c=>`<td>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:d.type==='EMAIL'?`<p><b>From:</b> ${escapeHTML(d.from)}<br><b>To:</b> ${escapeHTML(d.to)}<br><b>Date:</b> ${escapeHTML(d.date)}<br><b>Subject:</b> ${escapeHTML(d.subject)}</p><p>${escapeHTML(d.body)}</p>`:d.type==='CHAT'?d.messages.map(m=>`<p><b>${escapeHTML(m.sender)} · ${escapeHTML(m.time)}</b>: ${escapeHTML(m.text)}</p>`).join(''):d.type==='FORM'?`<b>${escapeHTML(d.title)}</b>`+d.fields.map(f=>`<p>${escapeHTML(f.label)}: ${escapeHTML(f.value)}</p>`).join(''):d.type==='IMAGE'?`<p>Hình ảnh: ${escapeHTML(d.image)}</p>`:`<p>${escapeHTML(d.body)}</p>`}</div></div>`).join('')||'';return `<div class="crumb">Quản lý đề thi › ${escapeHTML(e.name)} › Part ${p} › Xem chi tiết</div>${pagehead(`Chi tiết · Part ${p}`,`Xem nội dung trực tiếp của ${e.name}.`,`${btn('← Quay lại','back-composer')}${btn('Sửa trực tiếp','edit:'+u.id,'primary')}`)}<div class="formwrap">${p!==5?`<div class="card cardpad"><h2 style="font-size:15px">${p===7?'Tài liệu đọc':p===3?'Hội thoại chung':p===4?'Bài nói':p===6?'Đoạn văn':'Âm thanh / hình ảnh'}</h2><div class="docpreview">${p===7?doc:`<div style="white-space:pre-wrap">${escapeHTML(p===6?u.passage:u.shared)}</div><p class="muted">${escapeHTML(u.audio)} ${escapeHTML(u.image)}</p>`}</div></div>`:''}<div class="card"><div class="detailbar"><strong>${u.questions.length} câu hỏi</strong><span class="pill gray">Part ${p}</span></div>${questionHTML}</div></div>`}
function criteriaPage(){const defaults=limits.slice(1).map(limit=>[0,limit,0]);return `<div class="crumb">Quản trị › Cấu hình sinh đề</div>${pagehead('Cấu hình sinh đề','Bản minh họa UI độc lập với luồng tự soạn đề. Soạn thủ công không chọn câu từ ngân hàng.') }<div class="card cardpad"><h2 style="font-size:15px">Phân bổ độ khó · 200 câu</h2><div class="gridscroll"><table class="table"><thead><tr><th>Part</th><th>Dễ</th><th>Trung bình</th><th>Khó</th><th>Tổng</th></tr></thead><tbody>${defaults.map((a,i)=>`<tr data-limit="${limits[i+1]}"><td><strong>Part ${i+1}</strong> · ${labels[i+1]}</td>${a.map(v=>`<td><input class="field numfield" type="number" min="0" value="${v}" data-crit="1"></td>`).join('')}<td class="critcount">${limits[i+1]} / ${limits[i+1]}</td></tr>`).join('')}</tbody></table></div><div class="footbar"><b id="crit-total">Tổng: 200 / 200 câu</b>${btn('Kiểm tra phân bổ','check-criteria','primary')}</div></div>`}
function render(){document.querySelector('#nav-exams').classList.toggle('active',!['criteria','bank'].includes(view));document.querySelector('#nav-bank').classList.toggle('active',view==='bank');document.querySelector('#nav-criteria').classList.toggle('active',view==='criteria');document.querySelector('#top-name').textContent=view==='criteria'?'Cấu hình sinh đề':view==='bank'?'Ngân hàng câu hỏi đề thi':'Quản lý đề thi';app.innerHTML=view==='exams'?examsPage():view==='bank'?bankPage():view==='composer'?composerPage():view==='edit-unit'?unitEditor():view==='show-unit'?showUnit():criteriaPage()}
function fillDemo(){const u=editor,p=part;for(let i=0;i<u.questions.length;i++)u.questions[i]=seedQuestion(p,i);if([1,2,3,4].includes(p))u.audio='audio-demo.mp3';if(p===1)u.image='image-demo.png';if(p===3)u.shared='W: Can we meet tomorrow?\nM: Yes, at 10 a.m.';if(p===4)u.shared='Good morning. Our new service will launch next month.';if(p===6)u.passage='This is [1] example passage. Please [2] it carefully. Our results [3] tomorrow. Thank you [4] your attention.';if(p===7)u.documents=[{...makeDoc('TABLE'),title:'Sample prices',headers:['Product','Price'],rows:[['Item A','$10'],['Item B','$20']]}];editDirty=true;render()}
function validateUnit(u,p){const n=u.questions.length;if(p===3||p===4){if(n!==3)return 'Part 3/4 phải có đúng ba câu trong một nhóm.';if(!u.audio)return 'Cần chọn audio chung.';}if(p===6){if(n!==4)return 'Part 6 phải có bốn câu.';for(let i=1;i<=4;i++)if(!u.passage.includes('['+i+']'))return 'Passage Part 6 thiếu chỗ trống ['+i+'].';}if(p===7){if(n<2||n>5)return 'Part 7 cần 2–5 câu trong nhóm.';if(u.documents.length<1||u.documents.length>3)return 'Part 7 cần 1–3 tài liệu.';for(const d of u.documents){if(d.type==='TABLE'&&(!d.headers.length||!d.rows.length))return 'Tài liệu TABLE thiếu cột hoặc hàng.';if(d.type==='EMAIL'&&(!d.from||!d.to||!d.subject||!d.body))return 'EMAIL cần người gửi, người nhận, tiêu đề và nội dung.';if(d.type==='TEXT'&&!d.body)return 'TEXT không được để trống.';if(d.type==='CHAT'&&d.messages.some(m=>!m.sender||!m.text))return 'CHAT thiếu người gửi hoặc nội dung.';if(d.type==='FORM'&&d.fields.some(f=>!f.label||!f.value))return 'FORM thiếu nhãn hoặc giá trị.';if(d.type==='IMAGE'&&!d.image)return 'Tài liệu IMAGE cần ảnh.';}}if(p===1&&(!u.audio||!u.image))return 'Part 1 cần ảnh và audio.';if(p===2&&!u.audio)return 'Part 2 cần audio.';for(let i=0;i<n;i++){const q=u.questions[i],answers=q.answers.slice(0,p===2?3:4);if(!q.text.trim())return 'Câu '+(i+1)+' chưa có nội dung.';if(answers.some(v=>!String(v).trim()))return 'Câu '+(i+1)+' chưa đủ phương án.';if(!q.explanation.trim())return 'Câu '+(i+1)+' chưa có giải thích.';}return null}
function saveUnit(){const e=active(),list=units(e,part),err=validateUnit(editor,part);if(err){notify(err);return}const prev=editorMode==='edit'?list.find(u=>u.id===editor.id):null;const next=count(e,part)-(prev?prev.questions.length:0)+editor.questions.length;if(next>limits[part]){notify('Part '+part+' vượt định mức '+limits[part]+' câu. Không thể lưu.');return}if(!e.items[String(part)])e.items[String(part)]=[];const copy=clone(editor);if(editorMode==='edit'){const at=e.items[String(part)].findIndex(x=>x.id===copy.id);if(at<0)return;e.items[String(part)][at]=copy;}else e.items[String(part)].push(copy);
e.updated=new Date().toISOString();
const existing=state.bank[copy.id];
state.bank[copy.id]={id:copy.id,part,unit:clone(copy),examIds:existing?.examIds?.includes(e.id)?existing.examIds:[...(existing?.examIds||[]),e.id],updated:e.updated};
store();editDirty=false;editor=null;view='composer';render();notify((existing?'Đã cập nhật':'Đã thêm')+' '+copy.questions.length+' câu trong ngân hàng DE_THI và liên kết với Part '+part+'. Không tạo bản sao trùng.');}
function routeAction(a){if(a==='nav-exams'){go('exams');return}if(a==='nav-bank'){go('bank');return}if(a==='nav-criteria'){go('criteria');return}if(a==='create'){const e=makeExam('exam-'+(++state.seq),'Đề TOEIC mới '+state.seq,{},'editing');state.exams.unshift(e);examId=e.id;part=1;store();go('composer');notify('Đã tạo đề đang biên soạn. Hãy thêm câu trực tiếp theo từng Part.');return}if(a.startsWith('open:')){examId=a.split(':')[1];part=1;go('composer');return}if(a.startsWith('part:')){part=Number(a.split(':')[1]);go('composer');return}if(a==='back-composer'){go('composer');return}if(a==='add-unit'){editor=makeUnit(part);editorMode='add';editDirty=false;view='edit-unit';render();return}if(a.startsWith('edit:')){selectedId=a.split(':')[1];editor=clone(units(active(),part).find(x=>x.id===selectedId));editorMode='edit';editDirty=false;view='edit-unit';render();return}if(a.startsWith('inspect:')){selectedId=a.split(':')[1];go('show-unit');return}if(a.startsWith('remove:')){const id=a.split(':')[1];if(!confirm('Chỉ gỡ câu/nhóm khỏi đề? Câu/nhóm vẫn được giữ nguyên trong Ngân hàng câu hỏi đề thi.'))return;const e=active();e.items[String(part)]=units(e,part).filter(u=>u.id!==id);e.updated=new Date().toISOString();const bankItem=state.bank[id];if(bankItem)bankItem.examIds=bankItem.examIds.filter(ref=>ref!==e.id);store();render();notify('Đã gỡ khỏi Part '+part+'. Dữ liệu nguồn vẫn có trong ngân hàng DE_THI.');return}if(a==='save-progress'){const e=active();e.updated=new Date().toISOString();store();render();notify('Đã lưu tiến độ biên soạn trên trình duyệt. Bạn có thể ra danh sách rồi vào tiếp.');return}if(a==='publish'){const e=active();if(!limits.slice(1).every((x,i)=>count(e,i+1)===x)){notify('Chưa đủ 200 câu và định mức từng Part. Không thể xuất bản.');return}if(!confirm('Xuất bản đề đủ 200 câu cho học viên? Các câu đã được lưu vào ngân hàng DE_THI từ trước.'))return;e.status='published';e.updated=new Date().toISOString();store();render();notify('Đã xuất bản trong bản mô phỏng. Đề có một nội dung hiện hành.');return}if(a==='fill-demo'){fillDemo();return}if(a==='save-unit'){saveUnit();return}if(a==='add-question'){if(part!==7)return;if(editor.questions.length>=5){notify('Part 7 chỉ cho phép tối đa 5 câu trong một nhóm.');return}editor.questions.push(blankQuestion(editor.questions.length));editDirty=true;render();return}if(a==='remove-question'){if(part!==7)return;if(editor.questions.length<=2){notify('Part 7 phải giữ tối thiểu 2 câu.');return}editor.questions.pop();editDirty=true;render();return}if(a==='add-doc'){if(editor.documents.length>=3){notify('Part 7 chỉ có tối đa ba tài liệu.');return}editor.documents.push(makeDoc('TEXT'));editDirty=true;render();return}if(a.startsWith('del-doc:')){if(editor.documents.length<=1){notify('Part 7 cần ít nhất một tài liệu.');return}editor.documents.splice(Number(a.split(':')[1]),1);editDirty=true;render();return}if(a.startsWith('add-row:')){const d=editor.documents[+a.split(':')[1]];d.rows.push(d.headers.map(() =>''));editDirty=true;render();return}if(a.startsWith('del-row:')){const [,i,j]=a.split(':');const d=editor.documents[+i];if(d.rows.length<=1){notify('Bảng phải có ít nhất một hàng.');return}d.rows.splice(+j,1);editDirty=true;render();return}if(a.startsWith('add-col:')){const d=editor.documents[+a.split(':')[1]];d.headers.push('Cột '+(d.headers.length+1));d.rows.forEach(r=>r.push(''));editDirty=true;render();return}if(a.startsWith('add-msg:')){editor.documents[+a.split(':')[1]].messages.push({sender:'',time:'',text:''});editDirty=true;render();return}if(a.startsWith('del-msg:')){const [,i,j]=a.split(':');const d=editor.documents[+i];if(d.messages.length<=1){notify('CHAT cần ít nhất một tin nhắn.');return}d.messages.splice(+j,1);editDirty=true;render();return}if(a.startsWith('add-field:')){editor.documents[+a.split(':')[1]].fields.push({label:'',value:''});editDirty=true;render();return}if(a==='check-criteria'){const rows=[...document.querySelectorAll('tr[data-limit]')];let sum=0;let errors=0;rows.forEach(row=>{const values=[...row.querySelectorAll('input')].map(x=>Number(x.value));const s=values.reduce((a,b)=>a+b,0);const limit=Number(row.dataset.limit);if(values.some(v=>v<0||!Number.isInteger(v))||s!==limit)errors++;sum+=s;row.querySelector('.critcount').textContent=s+' / '+limit;row.querySelector('.critcount').style.color=s===limit?'#168464':'#bb5252'});document.querySelector('#crit-total').textContent='Tổng: '+sum+' / 200 câu';notify(errors?'Có '+errors+' Part chưa đúng định mức.':'Cấu hình hợp lệ trên bản demo.');return}}
function fieldUpdate(el){if(view!=='edit-unit'||!editor)return;const d=el.dataset;editDirty=true;if(d.unit){editor[d.unit]=el.value;return}if(d.media){editor[d.media]=el.files?.[0]?.name||'';const note=el.nextElementSibling;if(note)note.textContent=editor[d.media]||'Chưa chọn file';return}if(d.q!==undefined){const q=editor.questions[+d.q];if(d.answer!==undefined){q.answers[+d.answer]=el.value;return}if(d.qfield){q[d.qfield]=d.qfield==='correct'?Number(el.value):el.value;return}}if(d.doc!==undefined){const o=editor.documents[+d.doc];if(d.upload){o.image=el.files?.[0]?.name||'';return}if(d.prop){if(d.prop==='type'&&o.type!==el.value){const fresh=makeDoc(el.value);fresh.id=o.id;editor.documents[+d.doc]=fresh;render();return}o[d.prop]=el.value;return}if(d.header!==undefined){o.headers[+d.header]=el.value;return}if(d.row!==undefined){o.rows[+d.row][+d.col]=el.value;return}if(d.msg!==undefined){o.messages[+d.msg][d.mfield]=el.value;return}if(d.form!==undefined){o.fields[+d.form][d.fform]=el.value;return}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){routeAction(t.dataset.action)}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-unit],[data-q],[data-doc],[data-media]'))fieldUpdate(t)});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-unit],[data-q],[data-doc],[data-media]'))fieldUpdate(t)});
window.addEventListener('beforeunload',e=>{if(editDirty){e.preventDefault();e.returnValue=''}});
render();
})();
</script>
</body></html>
